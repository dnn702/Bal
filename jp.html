<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Idle Balls風ゲーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; background: #eef; }
    #game { position: relative; width: 100%; height: 60vh; background: #fff; overflow: hidden; }
    .circle {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 14px; user-select: none; cursor: pointer;
    }
    .ball {
      position: absolute; width: 20px; height: 20px; border-radius: 50%;
    }
    .info { margin: 10px; }
    button { margin: 5px; padding: 8px 16px; font-size: 14px; }
    .ball-info { border-top: 1px solid #ccc; margin-top: 10px; padding-top: 10px; }
    .save-controls { margin: 8px 0; }
    #saveStatus { font-size: 12px; color: #555; }
  /* 既存のCSSのあとに追記 */
  #ballUpgrades {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px;
    gap: 10px;
    scroll-snap-type: x mandatory;
  }

  #ballUpgrades button {
    flex: 0 0 auto;
    scroll-snap-align: start;
  }
      #ballUpgrades {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  white-space: nowrap;
  padding: 10px;
  gap: 10px;
  scroll-snap-type: x mandatory;
}

#ballUpgrades button {
  flex: 0 0 auto;
  scroll-snap-align: start;
}

.prestige-shop {
  margin: 14px 10px 10px;
  padding: 10px;
  border: 2px solid #7b2cff;
  border-radius: 12px;
  background: linear-gradient(180deg, #f5efff, #ffffff);
  text-align: left;
}

.prestige-shop h3 {
  margin: 0 0 6px;
  text-align: center;
  color: #5b16b5;
}

.prestige-note {
  font-size: 12px;
  line-height: 1.5;
  color: #555;
  margin-bottom: 8px;
  text-align: center;
}

#prestigeUpgrades {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 10px;
  padding: 6px 2px;
  scroll-snap-type: x mandatory;
}

#prestigeUpgrades button {
  flex: 0 0 auto;
  scroll-snap-align: start;
  border: 2px solid #7b2cff;
  border-radius: 10px;
  background: #fff;
}

.prestige-owned {
  opacity: 0.65;
  cursor: default;
}


  </style>

    function formatBigIntNumber(value) {
      const thousand = 1000n;
      if (value < thousand) return value.toString();
      let unitIndex = 0;
      let current = value;
      while (current >= thousand && unitIndex < UNITS.length - 1) {
        current /= thousand;
        unitIndex++;
      }
      const divisor = thousand ** BigInt(unitIndex);
      const whole = value / divisor;
      const remainder = value % divisor;
      const digits = whole.toString().length;
      let result = '';
      if (digits === 1) {
        const decimal = ((remainder * 100n) / divisor).toString().padStart(2, '0');
        result = `${whole}.${decimal}`;
      } else if (digits === 2) {
        const decimal = ((remainder * 10n) / divisor).toString();
        result = `${whole}.${decimal}`;
      } else {
        result = `${whole}`;
      }
      return result + UNITS[unitIndex];
    }

    let lastFrameTime = performance.now();
    let lastUiUpdate = 0;
    let stageChanging = false;

    function gameLoop(now) {
      const dt = Math.min(32, Math.max(0, now - lastFrameTime));
      lastFrameTime = now;
      const game = document.getElementById('game');
      const w = game.clientWidth;
      const h = game.clientHeight;
      let changed = false;

      if (stageChanging) {
        requestAnimationFrame(gameLoop);
        return;
      }

      // 通常ボール：1フレームに各ボール1回まで攻撃。
      for (const b of balls) {
        if (!b.purchased || !b.el || stageChanging) continue;

        const scale = dt / 16.67;
        b.x += b.vx * scale;
        b.y += b.vy * scale;

        if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); }
        else if (b.x >= w - 20) { b.x = Math.max(0, w - 20); b.vx = -Math.abs(b.vx); }
        if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); }
        else if (b.y >= h - 20) { b.y = Math.max(0, h - 20); b.vy = -Math.abs(b.vy); }

        b.el.style.transform = `translate3d(${b.x}px,${b.y}px,0)`;

        let hit = false;
        for (const c of circles) {
          if (c.hp <= 0n) continue;

          const dx = (c.x + 30) - (b.x + 10);
          const dy = (c.y + 30) - (b.y + 10);
          const distSq = dx * dx + dy * dy;

          if (distSq < 1600) {
            const dmg = b.attack < c.hp ? b.attack : c.hp;
            c.hp -= dmg;
            points += dmg;
            b.lastHitTime = now;
            changed = true;
            hit = true;

            const dist = Math.sqrt(distSq) || 1;
            const normalX = dx / dist;
            const normalY = dy / dist;
            const dot = b.vx * normalX + b.vy * normalY;
            b.vx -= 2 * dot * normalX;
            b.vy -= 2 * dot * normalY;
            break;
          }
        }

        if (!hit && now - b.lastHitTime > 6000) {
          const target = circles.find(c => c.hp > 0n);
          if (target) {
            const dx = (target.x + 30) - (b.x + 10);
            const dy = (target.y + 30) - (b.y + 10);
            const dist = Math.hypot(dx, dy) || 1;
            b.vx = (dx / dist) * 2.5;
            b.vy = (dy / dist) * 2.5;
          }
        }
      }

      // Prestigeボール：まず敵円に「直接当たった」時だけ発動。
      // 直撃した敵は100%。その周囲の敵は距離に応じて80%〜10%の範囲ダメージ。
      for (let i = 0; i < prestigeBalls.length; i++) {
        const b = prestigeBalls[i];
        const type = prestigeTypes[i];
        if (!b.purchased || !b.el || stageChanging) continue;

        const scale = dt / 16.67;
        b.x += b.vx * scale;
        b.y += b.vy * scale;

        if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); }
        else if (b.x >= w - 20) { b.x = Math.max(0, w - 20); b.vx = -Math.abs(b.vx); }
        if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); }
        else if (b.y >= h - 20) { b.y = Math.max(0, h - 20); b.vy = -Math.abs(b.vy); }

        b.el.style.transform = `translate3d(${b.x}px,${b.y}px,0)`;

        // まず「直撃対象」を1体だけ探す。範囲内にいるだけでは発動しない。
        let directTarget = null;
        let directDist = Infinity;
        for (const c of circles) {
          if (c.hp <= 0n) continue;
          const dx = (c.x + 30) - (b.x + 10);
          const dy = (c.y + 30) - (b.y + 10);
          const dist = Math.hypot(dx, dy);
          // ボール半径10 + 敵円半径30 = 中心間40px以内を「当たった」と判定。
          if (dist <= 40 && dist < directDist) {
            directTarget = c;
            directDist = dist;
          }
        }

        if (directTarget) {
          // 直撃：100%ダメージ
          let directDamage = b.attack < directTarget.hp ? b.attack : directTarget.hp;
          directTarget.hp -= directDamage;
          points += directDamage;
          b.lastHitTime = now;
          changed = true;

          // 跳ね返り
          const dx = (directTarget.x + 30) - (b.x + 10);
          const dy = (directTarget.y + 30) - (b.y + 10);
          const dist = Math.hypot(dx, dy) || 1;
          const normalX = dx / dist;
          const normalY = dy / dist;
          const dot = b.vx * normalX + b.vy * normalY;
          b.vx -= 2 * dot * normalX;
          b.vy -= 2 * dot * normalY;

          // 直撃点を中心に範囲攻撃。遠いほど80%→10%へ線形に減衰。
          for (const c of circles) {
            if (c === directTarget || c.hp <= 0n) continue;
            const dx2 = (c.x + 30) - (directTarget.x + 30);
            const dy2 = (c.y + 30) - (directTarget.y + 30);
            const dist2 = Math.hypot(dx2, dy2);
            if (dist2 > type.radius) continue;

            const ratio = Math.max(10, Math.min(80,
              Math.floor(80 - (70 * dist2 / type.radius))
            ));
            let splashDamage = (b.attack * BigInt(ratio)) / 100n;
            if (splashDamage < 1n) splashDamage = 1n;
            if (splashDamage > c.hp) splashDamage = c.hp;
            c.hp -= splashDamage;
            points += splashDamage;
            changed = true;
          }

          // 一撃で全滅しても、このフレームで別のPrestigeボールが
          // さらにステージを進めないようにする。
          if (circles.length && circles.every(c => c.hp <= 0n)) break;
        }

        if (!directTarget && now - b.lastHitTime > 6000) {
          const target = circles.find(c => c.hp > 0n);
          if (target) {
            const dx = (target.x + 30) - (b.x + 10);
            const dy = (target.y + 30) - (b.y + 10);
            const dist = Math.hypot(dx, dy) || 1;
            b.vx = (dx / dist) * type.speed;
            b.vy = (dy / dist) * type.speed;
          }
        }
      }

      if (changed) {
        renderCircles();
        if (now - lastUiUpdate > 100) {
          updateUI();
          lastUiUpdate = now;
        }
      }

      // どんな攻撃で全滅しても、ステージ移行は必ず1回だけ次フレームに予約。
      if (!stageChanging && circles.length && circles.every(c => c.hp <= 0n)) {
        stageChanging = true;
        stage++;
        requestAnimationFrame(() => {
          createCircles();
          stageChanging = false;
          renderBallUpgrades();
          renderBallInfo();
          updateUI();
          saveGame();
        });
      }

      requestAnimationFrame(gameLoop);
    }

    function serializeBigInt(value) {
      return value.toString();
    }

    function saveGame() {
      try {
        const data = {
          points: serializeBigInt(points),
          stage,
          tapAttack: serializeBigInt(tapAttack),
          tapCost: serializeBigInt(tapCost),
          balls: balls.map(b => ({
            attack: serializeBigInt(b.attack),
            cost: serializeBigInt(b.cost),
            purchased: b.purchased
          })),
          prestigeBalls: prestigeBalls.map(b => ({
            attack: serializeBigInt(b.attack),
            cost: serializeBigInt(b.cost),
            purchased: b.purchased
          })),
          savedAt: Date.now()
        };
        localStorage.setItem('idleBallsSave', JSON.stringify(data));
        const status = document.getElementById('saveStatus');
        if (status) status.textContent = '保存しました';
      } catch (e) {
        console.warn('セーブ失敗:', e);
      }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem('idleBallsSave');
        if (!raw) {
          const status = document.getElementById('saveStatus');
          if (status) status.textContent = 'セーブデータなし';
          return;
        }

        const data = JSON.parse(raw);
        points = BigInt(data.points);
        stage = Number(data.stage) || 1;
        tapAttack = BigInt(data.tapAttack);
        tapCost = BigInt(data.tapCost);

        // 既存ボールDOMを全削除してから復元。
        document.querySelectorAll('#game .ball').forEach(el => el.remove());

        balls = ballTypes.map((type, i) => {
          const saved = data.balls && data.balls[i];
          return {
            el: null, x: 0, y: 0, vx: 0, vy: 2,
            attack: saved ? BigInt(saved.attack) : type.attack,
            cost: saved ? BigInt(saved.cost) : type.cost,
            purchased: !!(saved && saved.purchased),
            lastHitTime: performance.now()
          };
        });

        prestigeBalls = prestigeTypes.map((type, i) => {
          const saved = data.prestigeBalls && data.prestigeBalls[i];
          return {
            el: null, x: 0, y: 0, vx: 0, vy: 0,
            attack: saved ? BigInt(saved.attack) : type.attack,
            cost: saved && saved.cost ? BigInt(saved.cost) : type.cost,
            purchased: !!(saved && saved.purchased),
            lastHitTime: performance.now()
          };
        });

        createCircles();
        balls.forEach((b, i) => {
          if (b.purchased) createBall(ballTypes[i], i);
        });
        prestigeBalls.forEach((b, i) => {
          if (b.purchased) createPrestigeBall(prestigeTypes[i], i);
        });
        renderBallUpgrades();
        renderBallInfo();
        updateUI();

        const status = document.getElementById('saveStatus');
        if (status) status.textContent = 'ロードしました';
      } catch (e) {
        console.error('ロード失敗:', e);
        const status = document.getElementById('saveStatus');
        if (status) status.textContent = 'ロードに失敗しました';
      }
    }

    function resetGame() {
      if (!confirm('セーブデータも含めてリセットしますか？')) return;
      localStorage.removeItem('idleBallsSave');
      location.reload();
    }

    // まず保存データがあれば復元。なければ新規ゲーム。
    if (localStorage.getItem('idleBallsSave')) {
      loadGame();
    } else {
      createCircles();
      renderBallUpgrades();
      updateUI();
    }

    // 操作中の進行を自動保存。
    setInterval(saveGame, 10000);
    window.addEventListener('beforeunload', saveGame);

    requestAnimationFrame(gameLoop);
  </script>
